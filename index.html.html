<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto</title>
<style>
:root{--bg:#e9eef2;--sf:#ffffff;--ink:#14233b;--mu:#5b6b80;--ac:#0e7c66;--on:#ffffff;--ln:#d3dce5;--neg:#b4411a;--pos:#0e7c66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1720;--sf:#17212c;--ink:#e6edf5;--mu:#93a3b8;--ac:#3dd6a8;--on:#06241b;--ln:#2a3846;--neg:#ff9f7a;--pos:#3dd6a8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1720;--sf:#17212c;--ink:#e6edf5;--mu:#93a3b8;--ac:#3dd6a8;--on:#06241b;--ln:#2a3846;--neg:#ff9f7a;--pos:#3dd6a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 56px}
.num{font-variant-numeric:tabular-nums}
.date{margin:0;color:var(--mu);font-size:1rem}
.clock{margin:2px 0 4px;font:600 clamp(3.4rem,17vw,5.6rem)/1 "Bahnschrift","DIN Alternate","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.status{margin:0 0 20px;color:var(--mu)}
.status b{color:var(--ink);font-weight:600}
.punch{display:block;width:100%;padding:22px 16px;border:0;border-radius:18px;font:600 1.2rem/1.2 inherit;cursor:pointer;background:var(--ac);color:var(--on);transition:transform .08s}
.punch.out{background:var(--ink);color:var(--bg)}
.punch:active{transform:scale(.985)}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
section{margin-top:30px}
h2{margin:0 0 10px;font-size:1.15rem;font-weight:650}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:6px 16px}
.row{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border-bottom:0}
.t{font:600 1.35rem/1 "Bahnschrift","DIN Alternate","Avenir Next Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:3.6rem}
.row .l{flex:1}
.x{background:none;border:0;color:var(--mu);font:inherit;font-size:.9rem;cursor:pointer;padding:4px 2px;text-decoration:underline}
.empty{margin:0;padding:14px 0;color:var(--mu)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:12px 2px 6px}
.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.hist .row{flex-wrap:wrap;gap:2px 12px}
.hist .d{flex:0 0 7.2rem;font-weight:600}
.hist .p{flex:1;min-width:9rem;color:var(--mu)}
.hist .h{text-align:right;min-width:4rem}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.mes{margin:0 2px 12px;color:var(--mu)}
.mes b{color:var(--ink);font-weight:600}
details{margin-top:14px}
summary{cursor:pointer;color:var(--mu)}
.form{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--mu)}
input{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 10px}
.btn{font:inherit;font-weight:600;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.msg{margin:8px 0 0;color:var(--neg);min-height:1.2em;font-size:.9rem}
.meta{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--mu)}
.meta input{width:5rem}
.mu{color:var(--mu)}
.vform{margin-top:12px}
.vform .w{flex:1 1 100%}
.vform input[type=text]{width:100%}
.vo{padding:14px 16px;margin-bottom:12px}
.vo p{margin:0 0 10px}
.v{padding:12px 0;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:flex-start}
.v:last-child{border-bottom:0}
.v .b{flex:1;min-width:0}
.v .b b,.v .m{display:block}
.v .m{color:var(--mu);font-size:.92rem}
.v img{width:72px;height:72px;object-fit:cover;border-radius:10px;cursor:pointer;margin-top:8px}
.v img.big{width:100%;height:auto;max-height:70vh}
.share{margin-top:22px}
.share .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:default}
.note{margin:8px 0 0;color:var(--mu);font-size:.9rem;min-height:1.3em}
@media (prefers-reduced-motion:reduce){.punch{transition:none}}
</style>
</head>
<body>
<main>
  <p class="date" id="date"></p>
  <p class="clock" id="clock">00:00:00</p>
  <p class="status" id="status"></p>
  <button class="punch" id="punch" type="button"></button>

  <section>
    <h2>Hoje</h2>
    <div class="card" id="today"></div>
    <div class="sum"><span id="wk" class="num"></span><span id="goal" class="num" style="color:var(--mu)"></span></div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <details>
      <summary>Esqueceu de registrar?</summary>
      <div class="form">
        <label>Data<input type="date" id="fd"></label>
        <label>Hora<input type="time" id="ft"></label>
        <button class="btn" id="add" type="button">Adicionar registro</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </details>
  </section>

  <section>
    <h2>Visitas</h2>
    <div id="vopen"></div>
    <details id="vdet">
      <summary>Nova visita</summary>
      <div class="form vform">
        <label class="w">Cliente ou local<input id="vc" type="text" maxlength="80" autocomplete="off"></label>
        <label class="w">Motivo da visita<input id="vm" type="text" maxlength="120" autocomplete="off"></label>
        <label>Data<input type="date" id="vd"></label>
        <label>Chegada<input type="time" id="va"></label>
        <label>Saída<input type="time" id="vs"></label>
        <label class="w">Foto da fachada<input id="vf" type="file" accept="image/*"></label>
        <label class="w">Observações<input id="vo" type="text" maxlength="200" autocomplete="off"></label>
        <button class="btn fill" id="vadd" type="button">Registrar visita</button>
      </div>
      <p class="msg" id="vmsg" role="status">Deixe a saída em branco se ainda estiver no local.</p>
    </details>
    <div class="card" id="vlist" style="margin-top:14px"></div>
  </section>

  <section>
    <h2>Histórico</h2>
    <p class="mes" id="mes"></p>
    <div class="card hist" id="hist"></div>
    <div class="share" id="share" hidden>
      <h2>Compartilhar</h2>
      <p class="mes" style="margin-bottom:0">Gera um arquivo com todos os registros e visitas salvos neste navegador. No celular, abre o menu de compartilhar, onde você escolhe o WhatsApp.</p>
      <div class="acts">
        <button class="btn fill" id="xpdf" type="button">Gerar PDF</button>
        <button class="btn" id="xxls" type="button">Gerar planilha</button>
      </div>
      <p class="note" id="snote" role="status"></p>
    </div>
    <div class="meta">
      <label for="meta" style="flex-direction:row;align-items:center;gap:10px">Jornada diária, em horas</label>
      <input type="number" id="meta" min="1" max="24" step="0.5">
    </div>
  </section>
</main>

<script>
const K='ponto:v1';
let S={punches:[],meta:8,visits:[]};
try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);if(Array.isArray(o.punches))S.punches=o.punches.filter(Number.isFinite);if(o.meta>0)S.meta=o.meta;if(Array.isArray(o.visits))S.visits=o.visits.filter(v=>v&&Number.isFinite(v.ini))}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=ms=>{const m=Math.round(Math.abs(ms)/60000);return Math.floor(m/60)+'h'+pad(m%60)};
const sd=ms=>(ms<0?'−':'+')+dur(ms);
const LBL=['Entrada','Saída para almoço','Volta do almoço','Saída'];
const label=i=>i<4?LBL[i]:(i%2?'Saída':'Entrada');
const H=3600000;

function byDay(){const m={};[...S.punches].sort((a,b)=>a-b).forEach(t=>{(m[dkey(t)]=m[dkey(t)]||[]).push(t)});return m}
function worked(list,live){let s=0;for(let i=0;i<list.length;i+=2){if(list[i+1]!==undefined)s+=list[i+1]-list[i];else if(live)s+=Date.now()-list[i]}return s}
function pairs(list){const o=[];for(let i=0;i<list.length;i+=2)o.push(hm(list[i])+' – '+(list[i+1]!==undefined?hm(list[i+1]):'…'));return o.join(' · ')}

function render(){
  const days=byDay(),today=dkey(Date.now()),list=days[today]||[],open=list.length%2===1;
  const b=$('punch');
  b.textContent='Registrar '+label(list.length).toLowerCase();
  b.className='punch '+(open?'out':'in');
  $('status').innerHTML=open?'Em expediente desde <b class="num">'+hm(list[list.length-1])+'</b>':(list.length?'Fora do expediente':'Nenhum registro hoje');
  $('today').innerHTML=list.length?list.map((t,i)=>'<div class="row"><span class="t">'+hm(t)+'</span><span class="l">'+label(i)+'</span><button class="x" data-t="'+t+'" aria-label="Remover registro das '+hm(t)+'">Remover</button></div>').join(''):'<p class="empty">Toque no botão acima para registrar a entrada.</p>';
  tick();
  // histórico
  const now=new Date(),ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
  let tot=0,saldo=0,n=0;
  const keys=Object.keys(days).sort().reverse();
  keys.forEach(k=>{if(k.startsWith(ym)){const w=worked(days[k],k===today);tot+=w;n++;if(k!==today)saldo+=w-S.meta*H}});
  const mn=now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  $('mes').innerHTML=n?'Em '+mn+': <b class="num">'+dur(tot)+'</b> trabalhadas em '+n+(n===1?' dia':' dias')+'. Saldo dos dias anteriores: <b class="num '+(saldo<0?'neg':'pos')+'">'+sd(saldo)+'</b>.':'Sem registros em '+mn+'.';
  const hist=keys.filter(k=>k!==today).slice(0,31);
  $('hist').innerHTML=hist.length?hist.map(k=>{const l=days[k],w=worked(l,false),inc=l.length%2===1,df=w-S.meta*H;const d=new Date(l[0]).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    return '<div class="row"><span class="d">'+d+'</span><span class="p num">'+pairs(l)+'</span><span class="h num">'+dur(w)+'</span>'+(inc?'<span class="neg">saída faltando</span>':'<span class="num '+(df<0?'neg':'pos')+'">'+sd(df)+'</span>')+'</div>'}).join(''):'<p class="empty">Os dias anteriores aparecem aqui.</p>';
  $('meta').value=S.meta;
}
function tick(){
  const n=new Date();
  $('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  $('date').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const l=byDay()[dkey(Date.now())]||[],w=worked(l,true);
  $('wk').textContent='Trabalhado hoje: '+dur(w);
  $('goal').textContent='Jornada: '+S.meta+'h';
  $('fill').style.width=Math.min(100,w/(S.meta*H)*100)+'%';
}
$('punch').onclick=()=>{S.punches.push(Date.now());save();render()};
$('today').onclick=e=>{const t=e.target.closest('[data-t]');if(!t)return;const v=Number(t.dataset.t),i=S.punches.indexOf(v);if(i>-1){S.punches.splice(i,1);save();render()}};
$('add').onclick=()=>{
  const d=$('fd').value,t=$('ft').value,m=$('msg');
  if(!d||!t){m.textContent='Preencha a data e a hora.';return}
  const ts=new Date(d+'T'+t).getTime();
  if(!Number.isFinite(ts)){m.textContent='Data ou hora inválida.';return}
  if(ts>Date.now()){m.textContent='Não é possível registrar um horário no futuro.';return}
  if(S.punches.includes(ts)){m.textContent='Já existe um registro nesse horário.';return}
  S.punches.push(ts);save();m.textContent='';$('ft').value='';render();
};
$('meta').onchange=e=>{const v=parseFloat(e.target.value);if(v>=1&&v<=24){S.meta=v;save()}render()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ponto-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fput=async(id,b)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const fget=async id=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const fdel=async id=>{const d=await idb();return new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=res;t.onerror=res})};
async function shrink(file,m=1000,q=.7){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(!b)throw new Error('img');
    return b;
  }finally{URL.revokeObjectURL(url)}
}
const vid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tms=(d,t)=>new Date(d+'T'+t).getTime();
const nowHM=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
let urls=[];
function renderV(){
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const open=S.visits.find(v=>!v.fim);
  $('vopen').innerHTML=open?'<div class="card vo"><p><b>Visita em andamento</b></p><p class="mu">'+esc(open.c)+', chegada às '+hm(open.ini)+'</p><button class="btn fill" id="vout" type="button">Registrar saída</button></div>':'';
  const L=[...S.visits].sort((a,b)=>b.ini-a.ini).slice(0,30);
  $('vlist').innerHTML=L.length?L.map(v=>{
    const d=new Date(v.ini).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
    const t=hm(v.ini)+' – '+(v.fim?hm(v.fim)+' ('+dur(v.fim-v.ini)+')':'em andamento');
    return '<div class="v"><div class="b"><b>'+esc(v.c)+'</b><span class="m num">'+d+', '+t+'</span>'+(v.m?'<span class="m">'+esc(v.m)+'</span>':'')+(v.o?'<span class="m">'+esc(v.o)+'</span>':'')+(v.foto?'<img data-f="'+v.id+'" alt="Foto da fachada de '+esc(v.c)+'">':'')+'</div><button class="x" data-v="'+v.id+'" aria-label="Remover visita a '+esc(v.c)+'">Remover</button></div>';
  }).join(''):'<p class="empty">As visitas registradas aparecem aqui.</p>';
  $('vlist').querySelectorAll('img[data-f]').forEach(async im=>{try{const b=await fget(im.dataset.f);if(b){const u=URL.createObjectURL(b);urls.push(u);im.src=u}}catch(e){}});
}
$('vdet').addEventListener('toggle',()=>{if($('vdet').open){$('vd').value=dkey(Date.now());if(!$('va').value)$('va').value=nowHM()}});
$('vopen').onclick=e=>{if(!e.target.closest('#vout'))return;const v=S.visits.find(x=>!x.fim);if(v){v.fim=Math.max(Date.now(),v.ini);save();renderV()}};
$('vlist').onclick=e=>{
  const im=e.target.closest('img');if(im){im.classList.toggle('big');return}
  const b=e.target.closest('[data-v]');if(!b)return;
  const i=S.visits.findIndex(x=>x.id===b.dataset.v);
  if(i>-1){const v=S.visits.splice(i,1)[0];if(v.foto)fdel(v.id).catch(()=>{});save();renderV()}
};
$('vadd').onclick=async()=>{
  const m=$('vmsg'),bt=$('vadd'),c=$('vc').value.trim(),d=$('vd').value,a=$('va').value,s=$('vs').value;
  if(!c){m.textContent='Informe o cliente ou o local.';return}
  if(!d||!a){m.textContent='Informe a data e a hora de chegada.';return}
  const ini=tms(d,a),fim=s?tms(d,s):null;
  if(!Number.isFinite(ini)||(s&&!Number.isFinite(fim))){m.textContent='Data ou hora inválida.';return}
  if(ini>Date.now()||(fim&&fim>Date.now())){m.textContent='Chegada e saída não podem estar no futuro.';return}
  if(fim&&fim<ini){m.textContent='A saída precisa ser depois da chegada.';return}
  if(!fim&&S.visits.some(x=>!x.fim)){m.textContent='Já existe uma visita em andamento. Registre a saída dela antes.';return}
  bt.disabled=true;
  const v={id:vid(),c,m:$('vm').value.trim(),o:$('vo').value.trim(),ini,fim,foto:false};
  let warn='';const f=$('vf').files[0];
  if(f){try{await fput(v.id,await shrink(f));v.foto=true}catch(e){warn='A visita foi registrada, mas não foi possível guardar a foto.'}}
  S.visits.push(v);save();
  ['vc','vm','vo','vs','va'].forEach(i=>$(i).value='');$('vf').value='';
  m.textContent=warn;bt.disabled=false;renderV();
};
const DL={async save({filename,data}){
  const type=filename.endsWith('.pdf')?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob=new Blob([data],{type});
  try{const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}}
  catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}};
$('share').hidden=false;
const lib=(src,ok)=>new Promise((res,rej)=>{if(ok())return res();const s=document.createElement('script');s.src=src;s.onload=()=>ok()?res():rej(new Error('lib'));s.onerror=()=>rej(new Error('lib'));document.head.appendChild(s)});
function rows(){const days=byDay();return Object.keys(days).sort().map(k=>{const l=days[k],open=l.length%2===1,w=worked(l,false);return{l,open,w,df:open?null:w-S.meta*H,date:new Date(l[0])}})}
const totals=R=>({tot:R.reduce((s,r)=>s+r.w,0),sal:R.reduce((s,r)=>s+(r.df||0),0)});
const wd=d=>d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
async function xls(){
  await lib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX);
  const R=rows(),n=Math.max(4,...R.map(r=>r.l.length)),T=totals(R);
  const head=['Data','Dia',...Array.from({length:n},(_,i)=>label(i)),'Total (h)','Saldo (h)','Observação'];
  const body=R.map(r=>[r.date.toLocaleDateString('pt-BR'),wd(r.date),...Array.from({length:n},(_,i)=>r.l[i]!==undefined?hm(r.l[i]):''),+(r.w/H).toFixed(2),r.df===null?'':+(r.df/H).toFixed(2),r.open?'Saída faltando':'']);
  const ws=XLSX.utils.aoa_to_sheet([head,...body]);
  ws['!cols']=head.map(h=>({wch:Math.max(10,h.length+2)}));
  const rs=XLSX.utils.aoa_to_sheet([['Dias com registro',R.length],['Total trabalhado (h)',+(T.tot/H).toFixed(2)],['Jornada diária (h)',S.meta],['Saldo (h)',+(T.sal/H).toFixed(2)],['Gerado em',new Date().toLocaleString('pt-BR')]]);
  rs['!cols']=[{wch:24},{wch:20}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registros');XLSX.utils.book_append_sheet(wb,rs,'Resumo');
  if(S.visits.length){const V=[...S.visits].sort((a,b)=>a.ini-b.ini);
    const vs=XLSX.utils.aoa_to_sheet([['Data','Cliente ou local','Motivo','Chegada','Saída','Duração (h)','Foto','Observações'],...V.map(v=>[new Date(v.ini).toLocaleDateString('pt-BR'),v.c,v.m,hm(v.ini),v.fim?hm(v.fim):'',v.fim?+((v.fim-v.ini)/H).toFixed(2):'',v.foto?'Sim':'Não',v.o])]);
    vs['!cols']=[{wch:12},{wch:28},{wch:30},{wch:10},{wch:10},{wch:12},{wch:8},{wch:40}];
    XLSX.utils.book_append_sheet(wb,vs,'Visitas')}
  return XLSX.write(wb,{type:'array',bookType:'xlsx'});
}
async function pdf(){
  await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf);
  const R=rows(),T=totals(R),doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const sa=ms=>(ms<0?'-':'+')+dur(ms);
  let y=20;
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('Registro de ponto',14,y);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  y+=7;doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),14,y);
  y+=6;doc.text('Dias com registro: '+R.length+'     Total trabalhado: '+dur(T.tot)+'     Jornada diária: '+S.meta+' h     Saldo: '+sa(T.sal),14,y);
  y+=12;
  const head=()=>{doc.setFont('helvetica','bold');doc.text('Data',14,y);doc.text('Registros',48,y);doc.text('Total',150,y);doc.text('Saldo',176,y);doc.line(14,y+2,196,y+2);y+=8;doc.setFont('helvetica','normal')};
  head();
  R.forEach(r=>{
    const txt=pairs(r.l).replace(/ – /g,' - ').replace('…','--:--').replace(/ · /g,'   |   ');
    const reg=doc.splitTextToSize(txt,98),h=reg.length*5+3;
    if(y+h>284){doc.addPage();y=20;head()}
    doc.text(r.date.toLocaleDateString('pt-BR')+' '+wd(r.date),14,y);
    doc.text(reg,48,y);
    doc.text(dur(r.w),150,y);
    doc.text(r.open?'em aberto':sa(r.df),176,y);
    y+=h;
  });
  if(S.visits.length){
    const toData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
    const dims=u=>new Promise(r=>{const i=new Image();i.onload=()=>r([i.width,i.height]);i.onerror=()=>r(null);i.src=u});
    doc.addPage();y=20;
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Visitas',14,y);
    doc.setFontSize(10);y+=9;
    for(const v of [...S.visits].sort((a,b)=>a.ini-b.ini)){
      let img=null,iw=0,ih=0;
      if(v.foto){try{const b=await fget(v.id);if(b){img=await toData(await shrink(b,600,.65));const d=await dims(img);if(d){iw=40;ih=iw*d[1]/d[0];if(ih>45){ih=45;iw=ih*d[0]/d[1]}}else img=null}}catch(e){img=null}}
      const w=img?138:180;
      doc.setFont('helvetica','bold');
      const tl=doc.splitTextToSize(new Date(v.ini).toLocaleDateString('pt-BR')+'  '+v.c,w);
      doc.setFont('helvetica','normal');
      const t2='Chegada '+hm(v.ini)+'     Saída '+(v.fim?hm(v.fim)+'     Duração '+dur(v.fim-v.ini):'em andamento');
      const rest=[...(v.m?doc.splitTextToSize('Motivo: '+v.m,w):[]),...(v.o?doc.splitTextToSize('Obs.: '+v.o,w):[])];
      const h=Math.max((tl.length+1+rest.length)*5+4,img?ih+4:0);
      if(y+h>284){doc.addPage();y=20}
      doc.setFont('helvetica','bold');doc.text(tl,14,y);doc.setFont('helvetica','normal');
      doc.text(t2,14,y+tl.length*5);
      if(rest.length)doc.text(rest,14,y+(tl.length+1)*5);
      if(img)doc.addImage(img,'JPEG',156,y-4,iw,ih);
      doc.line(14,y+h-3,196,y+h-3);
      y+=h+2;
    }
  }
  return doc.output('arraybuffer');
}
async function go(kind){
  const note=$('snote'),btns=[$('xpdf'),$('xxls')];
  if(!S.punches.length&&!S.visits.length){note.textContent='Ainda não há registros para compartilhar.';return}
  btns.forEach(b=>b.disabled=true);note.textContent='Gerando arquivo…';
  try{
    const data=await(kind==='pdf'?pdf():xls());
    await DL.save({filename:'ponto-'+dkey(Date.now())+'.'+(kind==='pdf'?'pdf':'xlsx'),data});
    note.textContent='Arquivo salvo.';
  }catch(e){
    const c=e&&e.code;
    note.textContent=c==='declined'?'Download cancelado.':c?'Não foi possível salvar o arquivo aqui.':'Não foi possível gerar o arquivo. Verifique a conexão e tente de novo.';
  }
  btns.forEach(b=>b.disabled=false);
}
$('xpdf').onclick=()=>go('pdf');$('xxls').onclick=()=>go('xlsx');
setTimeout(()=>{lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf).catch(()=>{});lib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX).catch(()=>{})},800);
$('fd').value=dkey(Date.now());
render();renderV();
setInterval(()=>{const n=new Date();if(n.getSeconds()===0)render();else tick()},1000);
</script>
